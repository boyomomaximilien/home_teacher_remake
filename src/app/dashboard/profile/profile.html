<div class="profile-wrapper">

    <div class="profile-card">

        <h2 class="profile-title">Mon Profil</h2>

        <form class="profile-form">

            <div class="row g-3">

                <div class="col-12">
                    <label>Nom et prénom</label>
                    <input class="form-control"
                           disabled
                           [(ngModel)]="Nom"
                           [ngModelOptions]="{standalone:true}">
                </div>

                <div class="col-md-6">
                    <label>Date de naissance</label>
                    <input class="form-control"
                           [disabled]="!isActivate"
                           [(ngModel)]="DateNaissance"
                           [ngModelOptions]="{standalone:true}">
                </div>

                <div class="col-md-6">
                    <label>Mot de passe</label>
                    <input type="password"
                           class="form-control"
                           [disabled]="!isActivate"
                           [(ngModel)]="MotDePasse"
                           [ngModelOptions]="{standalone:true}">
                </div>

                <div class="col-md-6">
                    <label>Ville</label>
                    <select class="form-select"
                            [disabled]="!isActivate"
                            [(ngModel)]="Ville"
                            [ngModelOptions]="{standalone:true}">
                        <option value="">Choisir</option>
                        <option value="Douala">Douala</option>
                        <option value="Yaounde">Yaounde</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label>Quartier</label>
                    <input class="form-control"
                           [disabled]="!isActivate"
                           [(ngModel)]="Quartier"
                           [ngModelOptions]="{standalone:true}">
                </div>

                <div class="col-md-6">
                    <label>Contact</label>
                    <input class="form-control"
                           [disabled]="!isActivate"
                           [(ngModel)]="Contact"
                           [ngModelOptions]="{standalone:true}">
                </div>

                <div class="col-md-6">
                    <label>CNI</label>
                    <input class="form-control"
                           [disabled]="!isActivate"
                           [(ngModel)]="NumeroCNI"
                           [ngModelOptions]="{standalone:true}">
                </div>

                @if(currentUser?.Nature === 'teacher') {

                <div class="col-12">
                    <label>Description</label>
                    <textarea class="form-control"
                              [disabled]="!isActivate"
                              [(ngModel)]="Description"
                              [ngModelOptions]="{standalone:true}">
                    </textarea>
                </div>

                <div class="col-md-6">
                    <label>Expérience (années)</label>
                    <input type="number"
                           class="form-control"
                           [disabled]="!isActivate"
                           [(ngModel)]="anneesExperience"
                           [ngModelOptions]="{standalone:true}">
                </div>

                }

            </div>

            <!-- ACTIONS -->
            <div class="profile-actions">

                <button type="button"
                        class="btn btn-primary"
                        (click)="SauvegarderModifications()">
                    Sauvegarder
                </button>

                <button type="button"
                        class="btn btn-outline-primary"
                        (click)="activeModification()">
                    Modifier
                </button>

            </div>

        </form>

    </div>

</div>
