@if(touteMesDiscussion.length != 0){
@for(discussion of touteMesDiscussion;track discussion.Id){
<div class="container mt-3 mt-lg-5 d-flex justify-content-center">
    <div class="row mb-3 rounded shadow-lg d-flex justify-content-lg-between w-50 discussion-item animate-discussion"
        (click)="openDiscussion(discussion.Id)">
        <div class="col-lg-3 d-flex justify-content-center align-items-center">
            <div class="avatar-wrapper animate-avatar">
                <img src="personne_icone.png" class="m-2 rounded-circle discussion-avatar" style="max-height: 90px;">
            </div>
        </div>
        <div class="col-lg-6 d-flex align-items-center justify-content-center justify-content-lg-start my-2">
            <div class="animate-fade-in">
                <p class="h4 discussion-name">
                    @if(discussion.NomInterlocuteur !== utilisateurConnecte.Name){
                    {{ discussion.NomInterlocuteur}}
                    }
                    @else {
                    {{ discussion.NomCreateur}}
                    }
                </p>
            </div>
        </div>
        <div class="col-lg-2 d-flex align-items-center justify-content-center">
            <div>
                <button class="btn discussion-btn h5 text-center text-white position-relative animate-btn">
                    <span class="d-block">Open</span>
                </button>
            </div>
        </div>
    </div>
</div>
}
}
@else {
<div class="container my-5">
    <p class="h4 text-center text-secondary">
        Aucune discussion pour le momment
    </p>
</div>
}
