<div class="container">
    <div class="row d-flex justify-content-center">
        <div class="col-lg-2 d-flex justify-content-center mb-3">
            <img src="personne_icone.png" alt="" class="img-fluid rounded-circle border p-2" style="max-height: 200px;">
        </div>
        <div class="col-lg-5 mb-3 d-flex align-items-center justify-content-center">
            <div>
                <div class="d-flex justify-content-center">
                    <p class="display-6"> <b><b>{{utilisateurActuel?.Name}}</b></b></p>
                </div>
                <div>
                    <p class="text-center text-secondary"> <i>{{utilisateurActuel?.Description}}</i></p>
                    <p class="text-center text-secondary"> Identifiant Unique : {{utilisateurActuel?.Id}}</p>
                </div>
            </div>

        </div>
        <div class="container barMenu rounded-4 shadow-sm mx-2 mt-lg-4 px-lg-5 py-lg-3">
            <div class="row mx-lg-5 d-flex align-items-center justify-content-between">
                <div class="col-3 d-flex justify-content-center">
                    <button class="rounded-circle btn increase" (click)="displayedDashboard('contrat')">
                        <img src="images/menu/contrat2.png" class="img-fluid" style="max-height: 70px; ">
                    </button>

                </div>
                <div class="col-3  d-flex justify-content-center" (click)="displayedDashboard('discussion')">
                    <button class="rounded-circle btn increase">
                        <img src="images/menu/message.png" class="img-fluid " style="max-height: 70px;">
                    </button>

                </div>
                <div class="col-3  d-flex justify-content-center">
                    <button class="btn rounded-circle increase" (click)="displayedDashboard('profile')">
                        <img src="images/menu/personne.png" class="img-fluid" style="max-height: 70px;">
                    </button>
                </div>
            </div>
        </div>
        
    </div>
</div>

<div class="container">
    @if(this.pageAffichee == 'contrat'){

    <app-contrats [tousMesContrats]="tousMesContrats" (contractDeleted)="removeContractFromList($event)"></app-contrats>

    }
    @else if(this.pageAffichee == 'discussion'){

    <app-discussion (showDiscussion)="displayedDashboard($event)"
        [touteMesDiscussion]="touteMesDiscussion"></app-discussion>

    }
    @else if(this.pageAffichee == 'message'){

    <app-messages [discussionSelect]="laDiscussion" (retour)="displayedDashboard($event)"></app-messages>
    }
    @else{
    <app-profile></app-profile>
    }
</div>
