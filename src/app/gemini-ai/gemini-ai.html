<section class="ga-shell">
    <header class="ga-header">
        <div class="ga-title">
            <span class="ga-badge">COOL MODE</span>
            <h2 class="ga-name">AI Assiatant</h2>
            <p class="ga-sub">poser vos questions a l'assiatant.</p>
        </div>
        <div class="ga-orb d-none d-md-inline" aria-hidden="true"></div>
    </header>

    <div class="ga-log">
        @for(message of conversationLog; track $index) {
            <p class="ga-line" [class.is-assistant]="message.startsWith('Assistant')">{{message}}</p>
        }
    </div>

    <div class="ga-input">
        <label class="ga-label" for="ga-prompt">Parler avec l’Assistant</label>
        <textarea id="ga-prompt" class="ga-textarea" placeholder="saisissez votre demande…"
            [(ngModel)]="prompt"></textarea>
        <div class="ga-actions">
            <button class="ga-send" (click)="envoyerPrompt()">Envoyer</button>
        </div>
    </div>
</section>
