<section class="ai-shell">

    <header class="ai-header">

        <div>
            <span class="ai-badge">AI ASSISTANT</span>

            <h2 class="ai-title">Assistant</h2>

            <p class="ai-sub">
                Pose tes questions simplement
            </p>
        </div>

        <div class="ai-icon d-none d-md-block"></div>

    </header>

    <div class="ai-log">

        @for(message of conversationLog; track $index) {

            <div class="ai-message"
                 [class.user]="!message.startsWith('Assistant')"
                 [class.bot]="message.startsWith('Assistant')">

                {{ message }}

            </div>

        }

    </div>

    <div class="ai-input">

        <label class="ai-label">Message</label>

        <textarea
            class="ai-textarea"
            placeholder="Écris ton message..."
            [(ngModel)]="prompt">
        </textarea>

        <div class="ai-actions">

            <button class="ai-send" (click)="envoyerPrompt()">
                Envoyer
            </button>

        </div>

    </div>

</section>
