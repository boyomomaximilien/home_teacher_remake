<div class="container d-flex align-items-center border rounded mt-5 my-3 line-back py-3" style="max-width: 400px;">
    <div class="container p-3 ">
        @if(formConnection){
        <p class="h3 text-center mb-lg-5 mb-3 ">
            <b class="me-2"><b>Connexion</b></b>
            <img src="connection_logo.svg" style="max-height: 20px;">
        </p>

        <div class="form-floating mb-lg-5 mb-3">
            <input class="form-control" placeholder="" [maxLength]="50" [(ngModel)]="mailLogin">
            <label>E-mail</label>
        </div>
        <div class="form-floating mb-3">
            <input class="form-control" placeholder="" [maxLength]="50" [(ngModel)]="passwordLogin" type="password">
            <label>mot de passe</label>
        </div>
        <div class="p-3 d-flex justify-content-center ">
            <button class="btn opacity-75 text-white" (click)="logIn(mailLogin, passwordLogin)">
                connecter
            </button>
        </div>
        <div class="d-flex flex-row-reverse" (click)="alternerConnectionInscription()">
            <a class="opacity-50">inscription</a>
        </div>
        }
        @else {
        <p class="h3 text-center mb-lg-5 mb-3">
            <b class="me-2"><b>Inscription</b></b>
            <img src="add_logo.svg" style="max-height: 20px;">
        </p>

        <div class="form-floating mb-3">
            <input class="form-control" placeholder="" [maxLength]="50">
            <label>nom </label>
        </div>
        <div class="form-floating mb-3">
            <input class="form-control" placeholder="" [maxLength]="50">
            <label>Prenoms</label>
        </div>
        <div class="form-floating mb-3">
            <input class="form-control" placeholder="" [maxLength]="50" [(ngModel)]="mailSignUp">
            <label>Adresse mail</label>
        </div>
        <div class="container d-flex align-items-center justify-content-between">
            <p class="text-secondary me-2  p-2 border rounded">+237</p>
            <div class="form-floating mb-3">
                <input class="form-control" placeholder="" [maxLength]="9">
                <label>Numero de telephone </label>
            </div>
        </div>

        <div class="form-floating mb-3">
            <input class="form-control" type="password" placeholder="" [maxLength]="50"
                [(ngModel)]="passwordSignUpFirst">
            <label>mot de passe</label>
        </div>
        <div class="form-floating mb-3">
            <input class="form-control" type="password" placeholder="" [maxLength]="50" [(ngModel)]="passwordSignUp">
            <label>confirmer mot de passe</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="choix" value="enseignant"
                style="background-color: #23759e; border-width: 0;"> Donner cours
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="choix" value="client"
                style="background-color: #23759e; border-width: 0;">
            Besoin de cours
        </div>
        <div class="p-3 d-flex justify-content-center ">
            <button class="btn opacity-75 text-white">
                enregistrer
            </button>
        </div>
        <div class="d-flex flex-row-reverse" (click)="alternerConnectionInscription()">
            <a class="opacity-50">connexion</a>
        </div>
        }

    </div>
</div>
